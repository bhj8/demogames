<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>PENDING</title>
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<!-- 冒烟测试用的最小 DOM：id 与 index.html 保持一致 -->
<canvas id="gl"></canvas>
<div id="cross"></div><div id="vignette"></div><div id="hurtflash"></div><div id="healflash"></div>
<div id="dmgdirs"></div><div id="threats"></div>
<div id="clock"></div><div id="xpfill"></div><div id="lvlnum"></div>
<div id="slots"></div><div id="bosswrap"></div><div id="bossname"></div><div id="bossfill"></div>
<div id="toast"></div><div id="hint"></div>
<div id="hpfill"></div><div id="hpnum"></div>
<div id="ammo"></div><div id="ammobar"></div><div id="dashfill"></div>
<div id="cards"></div>
<div id="reloadwrap"><div id="reloadbar"></div></div>
<div id="hitmark"><i></i><i></i></div><div id="dmgnums"></div>
<div id="shieldvig"></div><div id="shieldflash"></div><div id="floattext"></div><div id="buffbar"></div>
<svg id="threatarcs" viewBox="0 0 400 400"><path/><path/><path/></svg>
<div class="objmark" id="medmark"><span></span></div>
<div class="objmark" id="dropmark"><span></span></div>
<div id="menu"></div><div id="pause"></div><div id="results"></div>
<button id="start"></button><div id="seedlabel"></div><button id="resume"></button>
<div id="debug"><div id="dbgstats"></div><div id="dbgbtns"></div>
<div id="dbgvariant"></div><div id="dbglog"></div></div>

<script>
window.__err = [];
window.onerror = (m, s, l, c, e) => { window.__err.push(m + ' @' + (s || '').split('/').pop() + ':' + l); };
window.addEventListener('unhandledrejection', e => window.__err.push('reject:' + e.reason));
</script>
<script src="js/three.min.js"></script>
<script src="js/tune.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/weapon.js"></script>
<script src="js/combat.js"></script>
<script src="js/game.js"></script>
<script>
/* 内联脚本与 game.js 共享全局词法作用域，可以直接摸到 const G / R / frame */
function report(lines) {
  document.title = 'RESULT>>' + lines.join(' | ') + '<<END';
}
addEventListener('load', () => {
  setTimeout(() => {
    const out = [];
    const guard = fn => { try { fn(); return null; } catch (e) { return e.message; } };

    if (window.__err.length) { report(['BOOT_ERR:' + window.__err.join(';')]); return; }
    out.push('boot=ok');
    /* frame() 自己会 requestAnimationFrame —— 掐掉它，只跑我手动推的帧，
       否则软件渲染下会无限自转，测试永远不结束 */
    window.requestAnimationFrame = () => 0;
    out.push('drawcalls_geo=' + Object.keys(R.geo).length);

    /* 进入战斗 */
    G.phase = 'play';
    let t = 0, autoPicks = 0;
    /* 三选一会冻结世界 —— 自动选第一张，否则测试会停在 choose 相 */
    const step = n => {
      for (let i = 0; i < n; i++) {
        t += 16.7; frame(t);
        let guardN = 0;
        while (G.phase === 'choose' && guardN++ < 40) {
          const c = document.querySelector('#cards .card');
          if (!c || !c.onclick) break;
          c.onclick(); autoPicks++;
        }
      }
    };
    const stepUntil = (cond, max) => {
      for (let i = 0; i < max; i++) { step(1); if (cond()) return true; }
      return false;
    };

    let err = guard(() => step(120));           // ~2s
    if (err) { report(['STEP1_ERR:' + err]); return; }
    out.push('frames120=ok');

    /* 刷怪审计：直接盯 Director 的实际行为，而不是事后猜。
       量四件事：最长多久没刷怪 / 有没有刷在玩家脸上 / live 里有没有重复对象 /
       视野里到底有没有东西可打。 */
    err = guard(() => {
      BOOT.timescale = 4;
      DebugPanel.god = true;                 // 量的是刷怪，不是难度
      const origSpawn = Director.spawnOne.bind(Director);
      let spawns = 0, lastSpawnT = 0, maxGap = 0, tooClose = 0, minSpawnDist = 1e9;
      Director.spawnOne = function () {
        origSpawn();
        const e = G.enemies.live[G.enemies.live.length - 1];
        spawns++;
        const g = G.time - lastSpawnT; if (g > maxGap) maxGap = g;
        lastSpawnT = G.time;
        if (e) {
          const d = Math.hypot(e.pos.x - G.player.pos.x, e.pos.z - G.player.pos.z);
          minSpawnDist = Math.min(minSpawnDist, d);
          if (d < TUNE.SPAWN.minDist - 0.5) tooClose++;
        }
      };
      let dupFrames = 0, minAll = 9999, sumAll = 0, sumFront = 0, n = 0, emptyFront = 0;
      const DPS = 12 * 9 * 0.55;
      for (let i = 0; i < 1100; i++) {
        G.player.yaw += 0.9 * 0.0167 * 4;
        const orbit = G.time * 0.35;
        G.player.pos.x = Math.cos(orbit) * 9;
        G.player.pos.z = Math.sin(orbit) * 9;
        step(1);
        let near = null, nd = 1e9;
        G.enemies.live.forEach(e => {
          if (e._dead || e.dead) return;
          const d = Math.hypot(e.pos.x - G.player.pos.x, e.pos.z - G.player.pos.z);
          if (d < nd) { nd = d; near = e; }
        });
        if (near && nd < 40) damageEnemy(near, DPS * 0.0167 * 4, makeAttack('primary'), { point: near.pos });

        /* live 里同一个对象出现两次 = 池子重复入列 BUG 复发 */
        const seen = new Set(); let dup = false;
        G.enemies.live.forEach(e => { if (seen.has(e.uid)) dup = true; seen.add(e.uid); });
        if (dup) dupFrames++;

        if (G.time > 10) {
          let front = 0;
          G.enemies.live.forEach(e => {
            if (e._dead || e.dead) return;
            const world = Math.atan2(e.pos.x - G.player.pos.x, e.pos.z - G.player.pos.z);
            let rel = world - (G.player.yaw + Math.PI);
            while (rel > Math.PI) rel -= Math.PI * 2;
            while (rel < -Math.PI) rel += Math.PI * 2;
            if (Math.abs(rel) < 0.79) front++;
          });
          const a = G.enemies.count;
          minAll = Math.min(minAll, a); sumAll += a; sumFront += front;
          if (front === 0) emptyFront++;
          n++;
        }
      }
      Director.spawnOne = origSpawn;
      BOOT.timescale = 1;
      G.player.hp = G.player.maxHp;
      out.push('spawn@' + Math.round(G.time) + 's n=' + spawns +
        ' maxGap=' + maxGap.toFixed(2) + 's' +
        ' minDist=' + minSpawnDist.toFixed(1) + 'm tooClose=' + tooClose +
        ' dupFrames=' + dupFrames);
      out.push('alive(min/avg)=' + minAll + '/' + Math.round(sumAll / n) +
        ' front45avg=' + Math.round(sumFront / n) +
        ' emptyFront=' + emptyFront + '/' + n +
        ' target@end=' + Director.target);
    });
    if (err) { report(['DENSITY_ERR:' + err]); return; }

    /* ---- todo.md 三个新系统的闭环审计 ----
       注意：这几段必须保证玩家不死。一旦死亡 G.over 会冻结主循环，
       后面所有审计都会静默空跑（第一版就是这么挂的）。 */

    /* 医疗：把血压在 30% 且免疫伤害，验证 need 累积 → 击杀掉落 → 拾取回血 */
    err = guard(() => {
      DebugPanel.god = false;
      G.medCooldown = 0; G.medNeed = 0; G.medical = null; G.medPending = false;
      let waited = 0;
      while (!G.medPending && waited < 1200) {
        G.player.iframe = 999;                       // 免疫，但保留低血量状态
        G.player.hp = G.player.maxHp * 0.30;
        step(1); waited++;
      }
      const needAt = G.medNeed;
      let victim = null;
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead && !e.minion && !e.boss && !victim) victim = e; });
      if (!victim) { victim = configureEnemy(G.enemies.get(), ENEMIES.grunt, new THREE.Vector3(3, 0, 3), {}); step(1); }
      const hpBefore = G.player.hp;
      killEnemy(victim, makeAttack('primary'));
      const dropped = !!G.medical;        // 必须在 step 之前检查：可能当场就被捡走
      let reached = false;
      if (G.medical) { G.player.pos.set(G.medical.x, 0, G.medical.z); step(3); reached = !G.medical; }
      else reached = true;                // 掉在脚下当场拾取
      const healed = G.player.hp - hpBefore;
      /* 满血时不应再产生医疗需求 */
      G.player.hp = G.player.maxHp; G.medNeed = 5;
      for (let q = 0; q < 120; q++) { G.player.iframe = 999; step(1); }
      out.push('medical: waited=' + (waited / 60).toFixed(1) + 's need=' + needAt.toFixed(0) +
        ' dropped=' + dropped + ' healed=' + healed.toFixed(0) +
        ' picked=' + reached + ' decayAtFull=' + (G.medNeed < 5));
      G.player.iframe = 0;
    });
    if (err) { report(['MED_ERR:' + err]); return; }

    /* 空投：排队 → 预告 → 落地 → 三模块 → 拾取 → Buff 生效与完整还原 */
    err = guard(() => {
      DebugPanel.god = true;
      G.buff = null; clearAirdrop(); recompute();
      G.supplyCharge = 1; G.lastDropAt = -999; G.dropQueued = true; G.bossSpawnAt = -999;
      let w = 0;
      while (!G.airdrop && w < 300) { step(1); w++; }
      const telegraphed = !!(G.airdrop && G.airdrop.state === 'falling');
      let w2 = 0;
      while (G.airdrop && G.airdrop.state === 'falling' && w2 < 900) { step(1); w2++; }
      const mods = (G.airdrop && G.airdrop.modules) ? G.airdrop.modules.length : 0;
      const fireBefore = G.derived.fireInterval;
      if (G.airdrop && G.airdrop.modules) {
        const m = G.airdrop.modules[0];
        G.player.pos.set(m.x, 0, m.z); step(3);
      }
      const buffOn = G.buff ? G.buff.id : 'none';
      const fireDuring = G.derived.fireInterval;
      const ammoBefore = G.player.gun.ammo;
      G.player.gun.held = true; step(90); G.player.gun.held = false;
      const drain = ammoBefore - G.player.gun.ammo;
      let w3 = 0;
      while (G.buff && w3 < 2000) { step(1); w3++; }
      out.push('airdrop: wait=' + w + 'f telegraph=' + telegraphed + ' modules=' + mods +
        ' buff=' + buffOn + ' rate ' + fireBefore.toFixed(4) + '->' + fireDuring.toFixed(4) +
        ' ammoDrain=' + drain + ' restored=' + (Math.abs(G.derived.fireInterval - fireBefore) < 1e-9));
    });
    if (err) { report(['DROP_ERR:' + err]); return; }

    /* 护盾：伤害必须先扣护盾且不掉血；打穿后溢出才进生命 */
    err = guard(() => {
      G.buff = null; recompute();
      applyBuff('shield');
      G.player.hp = G.player.maxHp;
      G.player.iframe = 0; G.player.dashIFrame = 0;
      const hp0 = G.player.hp, sh0 = G.buff.shield;
      hurtPlayer(20, new THREE.Vector3(1, 0, 1), 'melee');
      const absorbOnly = (G.player.hp === hp0) && (Math.abs(G.buff.shield - (sh0 - 20)) < 0.01);
      G.player.iframe = 0; G.buff.shield = 5;
      hurtPlayer(25, new THREE.Vector3(1, 0, 1), 'melee');
      const overflow = Math.round(hp0 - G.player.hp);
      const ended = (!G.buff || G.buff.t <= 0);
      out.push('shield: absorbOnly=' + absorbOnly + ' overflow=' + overflow + '/20 endedOnBreak=' + ended);
      G.buff = null; recompute(); G.player.hp = G.player.maxHp;
    });
    if (err) { report(['SHIELD_ERR:' + err]); return; }

    /* 近战前摇：验证"接触不再直接扣血"与"前摇结束前离开就落空" */
    err = guard(() => {
      DebugPanel.god = false;
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
      G.enemies.compact();
      G.player.maxHp = 1e6; G.player.hp = 1e6;      // 不调 recompute，避免被改回去
      G.player.pos.set(0, 0, 0); G.player.iframe = 0;
      const e = configureEnemy(G.enemies.get(), ENEMIES.grunt, new THREE.Vector3(1.1, 0, 0), {});
      e.spawnGrace = 0; e.atkT = 0;
      const dmg0 = G.stats.dmgTaken;
      let sawWindup = false, dmgDuringWindup = 0;
      for (let i = 0; i < 45; i++) {
        step(1);
        if (e.state === 'melee') {
          sawWindup = true;
          dmgDuringWindup = Math.max(dmgDuringWindup, G.stats.dmgTaken - dmg0);
        }
      }
      const landed = G.stats.dmgTaken - dmg0;
      /* 再来一次，这回前摇途中跑掉 */
      const whiff0 = G.meleeWhiffs;
      e.state = 'walk'; e.atkT = 0; G.player.iframe = 0;
      let guardN = 0;
      while (e.state !== 'melee' && guardN++ < 60) step(1);
      G.player.pos.set(25, 0, 25);                  // 前摇中逃走
      step(45);
      out.push('melee: windup=' + sawWindup + ' dmgDuringWindup=' + dmgDuringWindup.toFixed(0) +
        ' landed=' + landed.toFixed(0) + ' whiffOnEscape=' + (G.meleeWhiffs - whiff0));
      DebugPanel.god = true;
      recompute(); G.player.hp = G.player.maxHp; G.player.pos.set(0, 0, 0);
    });
    if (err) { report(['MELEE_ERR:' + err]); return; }

    /* 威胁扇区：正后方放一群怪，验证聚合成弧而不是几十个箭头，且进入视野后隐藏 */
    err = guard(() => {
      DebugPanel.god = true;
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
      G.enemies.compact();
      G.player.pos.set(0, 0, 0); G.player.yaw = 0;
      for (let n = 0; n < 12; n++) {
        const a = G.player.yaw + (n - 6) * 0.13;          // yaw 方向 = 正后方
        const d = 6 + (n % 3) * 2;
        configureEnemy(G.enemies.get(), ENEMIES.grunt,
          new THREE.Vector3(Math.sin(a) * d, 0, Math.cos(a) * d), { grace: 9 });
      }
      step(4);
      const arcs = UI._arcs.map(el => +el.getAttribute('opacity') || 0);
      const litBehind = arcs.filter(v => v > 0.01).length;
      const arrowsBehind = UI._threats.filter(el => +el.style.opacity > 0.01).length;
      /* 转身面对它们，一般威胁应当隐藏 */
      G.player.yaw += Math.PI;
      step(4);
      const litFacing = UI._arcs.map(el => +el.getAttribute('opacity') || 0).filter(v => v > 0.01).length;
      out.push('threat: arcsBehind=' + litBehind + '/' + UI._arcs.length +
        ' arrows=' + arrowsBehind + ' arcsWhenFacing=' + litFacing);
    });
    if (err) { report(['THREAT_ERR:' + err]); return; }

    /* 弱点闭环：用无散布枪对准每种敌人的头部球心与躯干中心各打一发，
       验证"瞄头稳定触发、瞄躯干不误判"，以及首轮的 3 发 / 1 发目标。 */
    err = guard(() => {
      DebugPanel.god = true; DebugPanel.noSpread = true;
      G.time = 0;                                    // 回到开局血量，验证首轮数值
      G.mods = {}; G.mutations = []; G.mutationSet = {}; recompute();
      const rows = [];
      ['grunt', 'heavy', 'spitter', 'charger', 'midboss'].forEach(kind => {
        G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
        G.enemies.compact();
        G.player.pos.set(0, 0, 0); G.player.yaw = 0;

        const shootAt = (target) => {
          G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
          G.enemies.compact();
          const e = configureEnemy(G.enemies.get(), ENEMIES[kind], new THREE.Vector3(0, 0, -12), { grace: 9999 });
          e.speed = 0; e.maxHp = e.hp = 1e7;
          G.hash.clear(); G.hash.insert(e, e.pos.x, e.pos.z);
          const from = new THREE.Vector3(0, TUNE.PLAYER.height, 0);
          const to = target === 'head'
            ? new THREE.Vector3(e.pos.x + e.face.x * e.weak.fwd * e.height,
                                e.pos.y + e.weak.y * e.height,
                                e.pos.z + e.face.z * e.weak.fwd * e.height)
            : new THREE.Vector3(e.pos.x, e.pos.y + e.height * 0.42, e.pos.z);
          const dir = to.clone().sub(from).normalize();
          G.bullets.live.forEach(b => G.bullets.release(b)); G.bullets.compact();
          const before = e.hp;
          spawnBullet(from, dir, G.derived.damage, makeAttack('primary'), {});
          for (let f = 0; f < 40; f++) updateBullets(1 / 240);
          return { dmg: before - e.hp, weak: (G.stats.weakHits || 0) };
        };
        const w0 = G.stats.weakHits || 0;
        const head = shootAt('head');
        const headWeak = (G.stats.weakHits || 0) > w0;
        const w1 = G.stats.weakHits || 0;
        const body = shootAt('body');
        const bodyWeak = (G.stats.weakHits || 0) > w1;
        rows.push(kind + '[head ' + head.dmg.toFixed(0) + (headWeak ? '/W' : '/-') +
                  ' body ' + body.dmg.toFixed(0) + (bodyWeak ? '/W' : '/-') + ']');
      });
      out.push('weak: ' + rows.join(' '));

      /* 首轮目标：开局普通丧尸 身体 3 发 / 弱点 1 发 */
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
      G.enemies.compact();
      const shots = (target) => {
        const e = configureEnemy(G.enemies.get(), ENEMIES.grunt, new THREE.Vector3(0, 0, -12), { grace: 9999 });
        e.speed = 0;
        G.hash.clear(); G.hash.insert(e, e.pos.x, e.pos.z);
        const from = new THREE.Vector3(0, TUNE.PLAYER.height, 0);
        const to = target === 'head'
          ? new THREE.Vector3(e.pos.x, e.pos.y + e.weak.y * e.height, e.pos.z + e.face.z * e.weak.fwd * e.height)
          : new THREE.Vector3(e.pos.x, e.pos.y + e.height * 0.42, e.pos.z);
        const dir = to.clone().sub(from).normalize();
        let n = 0;
        G.bullets.live.forEach(b => G.bullets.release(b)); G.bullets.compact();
        while (!e.dead && n < 12) {
          spawnBullet(from, dir, G.derived.damage, makeAttack('primary'), {});
          for (let f = 0; f < 40; f++) updateBullets(1 / 240);
          n++;
          G.hash.clear(); if (!e.dead) G.hash.insert(e, e.pos.x, e.pos.z);
        }
        G.enemies.release(e); G.enemies.compact();
        return n;
      };
      out.push('ttk@0s: bodyShots=' + shots('body') + ' headShots=' + shots('head') +
        ' (目标 3 / 1)');
      DebugPanel.noSpread = false;
    });
    if (err) { report(['WEAK_ERR:' + err]); return; }

    /* ---- todo2：枪械表现层验收 ---- */

    /* 每枪必须同时驱动枪机、抛壳、曳光；连续射击仍是离散的机械周期 */
    err = guard(() => {
      DebugPanel.god = true;
      G.player.pos.set(0, 0, 0);
      G.player.gun.ammo = G.derived.magazine; G.player.gun.reloadT = 0;
      WEAPON.on('reloadEnd');
      const s0 = WEAPON.stats.shells, t0 = WEAPON.stats.tracers;
      const boltSeen = [];
      G.player.gun.held = true;
      for (let i = 0; i < 30; i++) { step(1); boltSeen.push(WEAPON.boltSpring.x); }
      G.player.gun.held = false;
      const shells = WEAPON.stats.shells - s0, tracers = WEAPON.stats.tracers - t0;
      /* 枪机应当来回往复，而不是停在一个固定偏移上 */
      const bmax = Math.max.apply(null, boltSeen), bmin = Math.min.apply(null, boltSeen);
      out.push('weapon: shells=' + shells + ' tracers=' + tracers +
        ' boltCycle=' + (bmax - bmin).toFixed(3) + ' kickAlive=' + (Math.abs(WEAPON.kickZ.v) > 0.001));
    });
    if (err) { report(['WFX_ERR:' + err]); return; }

    /* 分阶段换弹：顺序、弹量恢复时点、reloadEnd 之前不得射击 */
    err = guard(() => {
      G.player.gun.ammo = 0; G.player.gun.reloadT = 0; G.player.gun.held = false;
      G.player.gun.emptyT = 0;
      let sawEmptyBoltLock = false;
      /* 先打最后一发，验证空仓锁膛 */
      G.player.gun.ammo = 1; WEAPON.boltLocked = false;
      G.player.gun.fireT = 0;
      G.player.gun.held = true;
      let guardS = 0;
      while (G.player.gun.ammo > 0 && guardS++ < 40) step(1);   // 等到那一发真的打出去
      G.player.gun.held = false;
      sawEmptyBoltLock = WEAPON.boltLocked;

      const phases = [];
      let ammoBeforeMagIn = -1, firedDuringReload = 0;
      firedDuringReload = 0;
      for (let i = 0; i < 200; i++) {
        const wasActive = WEAPON.reload.active;
        const shotsBefore = G.stats.shots;
        G.player.gun.held = true;                   // 换弹途中一直扣扳机
        step(1);
        /* 只统计"整帧都在换弹中"的射击：reloadEnd 当帧开火是合法的 */
        if (wasActive && WEAPON.reload.active) firedDuringReload += G.stats.shots - shotsBefore;
        if (WEAPON.reload.active) {
          if (phases[phases.length - 1] !== WEAPON.reload.phase) phases.push(WEAPON.reload.phase);
          if (WEAPON.reload.phase < 3) ammoBeforeMagIn = G.player.gun.ammo;
        }
        if (!WEAPON.reload.active && phases.length) break;
      }
      G.player.gun.held = false;
      out.push('reload: phases=' + phases.join('>') +
        ' ammoBeforeMagIn=' + ammoBeforeMagIn +
        ' ammoAfter=' + G.player.gun.ammo +
        ' firedDuringReload=' + firedDuringReload +
        ' boltLockedOnEmpty=' + sawEmptyBoltLock);
    });
    if (err) { report(['RELOAD_ERR:' + err]); return; }

    /* §13：换个世界朝向做同样的本地移动，枪摆必须一致
       （之前用 p.vel.x 是世界坐标，转身后含义会变） */
    err = guard(() => {
      const sample = (yaw, vx, vz) => {
        WEAPON.sway.x = WEAPON.sway.y = WEAPON.sway.vx = WEAPON.sway.vy = 0;
        WEAPON.bobT = 0; WEAPON.breathT = 0;
        G.player.yaw = yaw; G.mouseDX = 0; G.mouseDY = 0;
        G.player.gun.held = false;
        for (let i = 0; i < 20; i++) {
          G.player.vel.set(vx, 0, vz);
          step(1);
        }
        return WEAPON.rig.children[0].parent.position.x;
      };
      const a = sample(0, 1, 0);            // 面向 -Z 时向世界 +X 移动
      const b = sample(Math.PI / 2, 0, -1); // 转 90° 后做同样的"本地"移动
      out.push('localSway: yaw0=' + a.toFixed(4) + ' yaw90=' + b.toFixed(4) +
        ' same=' + (Math.abs(a - b) < 0.002));
      G.player.vel.set(0, 0, 0);
    });
    if (err) { report(['SWAY_ERR:' + err]); return; }

    /* §12 高负载：90 只敌人 + 全变异连锁 + 持续射击，枪械反馈不得缺失 */
    err = guard(() => {
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead) G.enemies.release(e); });
      G.enemies.compact();
      MUTATIONS.forEach(m => { if (!G.mutationSet[m.id]) { G.mutations.push(m.id); G.mutationSet[m.id] = true; } });
      ['caliber', 'caliber', 'bolt', 'catalyst', 'spread', 'cascade', 'twin'].forEach(id => { G.mods[id] = (G.mods[id] || 0) + 1; });
      recompute();
      for (let i = 0; i < 90; i++) {
        const a = i * 0.37, r = 6 + (i % 9) * 1.6;
        configureEnemy(G.enemies.get(), ENEMIES.grunt,
          new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r), {});
      }
      G.player.gun.ammo = G.derived.magazine;
      G.player.gun.held = true;
      const s0 = WEAPON.stats.shells, t0 = WEAPON.stats.tracers;
      const t1 = Date.now();
      for (let i = 0; i < 120; i++) step(1);
      const ms = Date.now() - t1;
      G.player.gun.held = false;
      out.push('load: enemies=' + G.enemies.count +
        ' shellsFired=' + (WEAPON.stats.shells - s0) +
        ' tracers=' + (WEAPON.stats.tracers - t0) +
        ' shellsLive=' + WEAPON.shellMesh.count +
        ' ' + (ms / 120).toFixed(1) + 'ms/frame(sw)');
    });
    if (err) { report(['LOAD_ERR:' + err]); return; }

    /* 强制拿满 4 个共同变异，并把变种放进池子 */
    err = guard(() => {
      ['blast', 'fission', 'conduct', 'ossify'].forEach(id => { takeMutation(id); G.phase = 'play'; });
      G.tutorialQueue.forEach(q => q.t = 0.01);
      step(60);
    });
    if (err) { report(['MUT_ERR:' + err]); return; }
    out.push('mutations=' + G.mutations.length);
    out.push('variantPool=' + G.variantPool.length);

    /* 触发链压力：大量改装 + 密集怪 */
    err = guard(() => {
      ['caliber', 'caliber', 'bolt', 'catalyst', 'spread', 'cascade', 'hunter', 'aftershock', 'feedback', 'twin']
        .forEach(id => { G.mods[id] = (G.mods[id] || 0) + 1; });
      recompute();
      for (let i = 0; i < 90; i++) {
        const a = i * 0.7, r = 4 + (i % 7);
        configureEnemy(G.enemies.get(), ENEMIES.grunt,
          new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      G.player.gun.held = true;
      step(180);
    });
    if (err) { report(['CHAIN_ERR:' + err]); return; }
    out.push('kills=' + G.stats.kills);
    out.push('procs=' + G.stats.procs);
    out.push('splits=' + G.stats.splits + ',blasts=' + G.stats.blasts + ',bolts=' + G.stats.bolts);
    out.push('alive=' + G.enemies.count);

    /* 每种变种都强制生成一次，检查模型/骨板/尸爆路径 */
    err = guard(() => {
      MUTATIONS.forEach(m => {
        configureEnemy(G.enemies.get(), G.variantTpl[m.id],
          new THREE.Vector3(RNG.fx.range(-8, 8), 0, RNG.fx.range(-8, 8)));
      });
      step(60);
      /* 全部打死，跑一遍尸潮侧后果（尸爆 / 幼体 / 电场） */
      G.enemies.live.forEach(e => { if (!e._dead && !e.dead && !e.boss) killEnemy(e, makeAttack('debug')); });
      step(90);   // 1.5s：尸爆引信(0.8s)已炸完，电场(0.7s后起，持续2.5s)应仍在
    });
    if (err) { report(['VARIANT_ERR:' + err]); return; }
    out.push('hazards=' + G.hazards.length + ',minions=' + G.enemies.live.filter(e => !e._dead && e.minion).length);

    /* 中期 Boss */
    let midOk;
    err = guard(() => { DebugPanel.jump(364); midOk = stepUntil(() => G.bossAlive, 400); });
    if (err) { report(['MIDBOSS_ERR:' + err]); return; }
    out.push('midboss=' + (G.bossAlive ? G.bossAlive.tpl.id : 'none:' + midOk));

    /* 打死中期 Boss，再跳到 12:00 召唤尸王 */
    let kingOk;
    err = guard(() => {
      if (G.bossAlive) { killEnemy(G.bossAlive, makeAttack('debug')); step(5); }
      DebugPanel.jump(719);
      kingOk = stepUntil(() => G.bossAlive && G.bossAlive.king, 400);
    });
    if (err) { report(['KING_ERR:' + err]); return; }
    out.push('king=' + (G.bossAlive ? G.bossAlive.tpl.id + ':p' + G.bossAlive.phase : 'none:' + kingOk));

    /* Boss 分阶段：直接扣血逼它换阶段 */
    err = guard(() => {
      if (G.bossAlive) {
        for (let k = 0; k < 4; k++) {
          G.bossAlive.hp = G.bossAlive.maxHp * (0.7 - k * 0.22);
          step(30);
        }
      }
    });
    if (err) { report(['PHASE_ERR:' + err]); return; }
    out.push('phase=' + (G.bossAlive ? G.bossAlive.phase : 'dead'));

    /* 结算页 */
    err = guard(() => { if (G.bossAlive) killEnemy(G.bossAlive, makeAttack('debug')); step(20); });
    if (err) { report(['WIN_ERR:' + err]); return; }
    out.push('over=' + G.over + ',won=' + G.won + ',autoPicks=' + autoPicks);
    out.push('resultsShown=' + (document.getElementById('results').innerHTML.length > 200));

    out.push('runtime_err=' + window.__err.length + (window.__err.length ? ':' + window.__err[0] : ''));
    report(out);
  }, 300);
});
</script>
