<script>
/* ============================================================================
   todo10 §10 阶段 D：多种子 12 分钟自动稳定性

   单独放，因为十局各跑满一整局要二十分钟以上 ——
   混进 _buildcheck 会让那套一秒出结果的验收变得没人愿意跑。

   量两件事：会不会崩，以及多局会不会长成同一把枪（§11.4）。
   数值强度是 _buildcheck 的事，这里不重复。

   用法：这一页跑一个种子（?seed=N）。十个种子由 _stability.js 逐个开新页面跑，
   每局都从干净的世界开始。
   ========================================================================== */
const L = [];
let FAIL = 0;
const say = s => L.push(s);
const ok = (cond, msg) => { if (!cond) { FAIL++; say('  <i>FAIL</i> ' + msg); } return cond; };

addEventListener('load', () => setTimeout(() => {
  try { main(); } catch (e) { done(['THROW:' + e.message + ' | ' + (e.stack || '').split('\n')[1]]); }
}, 300));

function done(lines) {
  document.getElementById('out').innerHTML = lines.join('\n');
  document.title = (FAIL ? 'FAILED(' + FAIL + ')' : 'ALLPASS') + ' err=' + window.__err.length;
}

function main() {
  if (window.__err.length) { done(['BOOT_ERR:' + window.__err.join(';')]); return; }
  window.requestAnimationFrame = () => 0;
  R.render = () => {};
  R.resize();

  /* 一次只跑【一个种子】，然后由外面的脚本换一个新页面再跑下一个。
     同一个页面里连跑十局会越跑越慢：导演、总线订阅、对象池这些东西
     跨局残留，第十局的每帧开销是第一局的十几倍（实测三局 68 秒、
     十局跑到 38 分钟还没完）。与其一个一个去堵，不如让每局都从
     真正干净的世界开始 —— 这也更接近玩家实际的一局。 */
  const seed = parseInt(new URLSearchParams(location.search).get('seed'), 10) || 11;
  const r = fullRun(seed);
  say('SEED ' + seed + '  ' + fmtTime(r.time) + '  升级 ' + r.picks +
      '  分子 ' + r.mol + '  击杀 ' + r.kills + '  拒绝 ' + r.rejected +
      '  错误 ' + r.err + '  ' + r.build);
  ok(r.err === 0, r.err + ' 次运行时错误');
  ok(r.rejected === 0, r.rejected + ' 次事件触顶 —— 伤害被静默削掉了（§8.3）');
  ok(r.time > 700, '没跑满 12 分钟（' + Math.round(r.time) + 's）');
  document.title = (FAIL ? 'FAILED' : 'OK') + '>>' + r.build + '|' + r.picks +
    '|' + r.mol + '|' + r.kills + '|' + r.err + '|' + r.rejected + '<<';
  document.getElementById('out').innerHTML = L.join('\n');
}

let _clock = 0;
function fullRun(seed) {
  RNG.init(seed);
  G.won = false; G.bossAlive = null; G.buff = null;
  document.getElementById('results').classList.remove('on');
  /* EVO 也必须重置 —— 忘了它的话，第二局起进化导演还带着上一局的
     evolutionIndex 和进度，整局只弹得出 0~1 次三选一（实测种子 22 只有
     1 次升级、种子 33 一次都没有）。 */
  BUILD.init(); ATK.init(); MAPEV.init(); MAPBUILD.init(); EVO.init();
  G.time = 0; G.tlIndex = 0; G.over = false; G.phase = 'play';
  G.stats.kills = 0;
  const err0 = window.__err.length;
  DebugPanel.god = true;                 // 量系统，不量难度
  /* 每一局都要把世界清干净。只清敌人是不够的：经验球、子弹、危险区
     会一局一局地攒下来，第十局的每帧开销是第一局的十几倍，
     表现是「跑到一半越来越慢，最后超时」。 */
  G.enemies.live.slice().forEach(e => { e.dead = true; G.enemies.release(e); });
  G.enemies.compact();
  G.bullets.live.slice().forEach(b => G.bullets.release(b));
  G.bullets.compact();
  G.xp.length = 0; G.hazards.length = 0; G.pendings.length = 0;
  G.medical = null; G.airdrop = null; G.buff = null;
  G.acids && G.acids.live && G.acids.live.slice().forEach(a => G.acids.release(a));
  G.acids && G.acids.compact && G.acids.compact();
  MOVE.teleport(G.player, 0, 1.2, 0);
  G.player.hp = G.player.maxHp;
  recompute();
  G.player.gun.ammo = G.derived.magazine;

  /* frame() 自己记 _last 时间戳，所以每局的 t 必须【接着上一局往下走】——
     从 0 重新开始会算出负的 dt，第二局起整局一帧都不推进（表现是 0:00）。 */
  let picks = 0, minFps = 1e9;
  for (let i = 0; i < 60 * 60 * 12 + 600; i++) {
    _clock += 16.7;
    frame(_clock);
    if (G.phase === 'choose') {
      const c = document.querySelector('#cards .card');
      if (c && c.onclick) { c.onclick(); picks++; }
    }
    G.player.gun.held = true;
    G.player.yaw += 0.55 * 0.0167;
    if (G.over) break;
  }
  G.player.gun.held = false;
  DebugPanel.god = false;
  return {
    time: G.time, picks: picks, kills: G.stats.kills,
    mol: BUILD.molecules().length,
    build: BUILD.molecules().map(c => c.name).join('+') || '无',
    rejected: ATK.budget.rejected,
    err: window.__err.length - err0,
    minFps: minFps
  };
}

</script>
