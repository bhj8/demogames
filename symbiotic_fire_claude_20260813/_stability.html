<script>
window.__err = [];
window.onerror = (m, s, l) => { window.__err.push(m + ' @' + (s || '').split('/').pop() + ':' + l); };

<script>
/* ============================================================================
   todo10 §10 阶段 D：多种子 12 分钟自动稳定性

   单独放，因为十局各跑满一整局要二十分钟以上 ——
   混进 _buildcheck 会让那套一秒出结果的验收变得没人愿意跑。

   量两件事：会不会崩，以及多局会不会长成同一把枪（§11.4）。
   数值强度是 _buildcheck 的事，这里不重复。

   用法：这一页跑一个种子（?seed=N）。十个种子由 _stability.js 逐个开新页面跑，
   每局都从干净的世界开始。
   ========================================================================== */
const L = [];
let FAIL = 0;
const say = s => L.push(s);
const ok = (cond, msg) => { if (!cond) { FAIL++; say('  <i>FAIL</i> ' + msg); } return cond; };

addEventListener('load', () => setTimeout(() => {
  try { main(); } catch (e) { done(['THROW:' + e.message + ' | ' + (e.stack || '').split('\n')[1]]); }
}, 300));

function done(lines) {
  document.getElementById('out').innerHTML = lines.join('\n');
  document.title = (FAIL ? 'FAILED(' + FAIL + ')' : 'ALLPASS') + ' err=' + window.__err.length;
}

function main() {
  if (window.__err.length) { done(['BOOT_ERR:' + window.__err.join(';')]); return; }
  window.requestAnimationFrame = () => 0;
  R.render = () => {};
  R.resize();

  /* 一次只跑【一个种子】，然后由外面的脚本换一个新页面再跑下一个。
     同一个页面里连跑十局会越跑越慢：导演、总线订阅、对象池这些东西
     跨局残留，第十局的每帧开销是第一局的十几倍（实测三局 68 秒、
     十局跑到 38 分钟还没完）。与其一个一个去堵，不如让每局都从
     真正干净的世界开始 —— 这也更接近玩家实际的一局。 */
  const seed = parseInt(new URLSearchParams(location.search).get('seed'), 10) || 11;
  /* ?strong=1：开局就塞一套强 Build 再跑。
     todo11 §4 的目标分两档（普通 19~20 / 强 22~24），而机器人本身
     只能代表「普通局」—— 想验证强 Build 那一档，就得先把 Build 给它。 */
  const strong = new URLSearchParams(location.search).get('strong') === '1';
  /* ?move=1：让机器人在四个战斗单元之间巡逻，而不是站着不动。
     这才是 Bao 描述的那种玩法 —— 站着不动的话全图尸潮都会走到你身上，
     刷怪再慢也感觉不到；一旦你在跑，「地图很满但你面前很空」才会暴露。 */
  const moving = new URLSearchParams(location.search).get('move') === '1';
  /* ?weak=N：把机器人的输出打成 1/N（间歇开火 + 瞄准漂移）。
     用来回答一个关键问题：升级次数到底对「打得好不好」有多敏感。
     Bao 报的是「8 分钟才 5 级」，而机器人稳定 19 次 —— 差别只可能出在这里。 */
  const weak = parseFloat(new URLSearchParams(location.search).get('weak')) || 1;
  /* ?secs=N —— 只跑 N 秒游戏内时间（默认整局 12 分钟）。
     整局要跑 43800 帧，机器慢的时候一局要十几分钟；
     而「新卡会不会在真实对局里报错 / 触顶」这件事，三分钟就问得出来。 */
  const secs = parseFloat(new URLSearchParams(location.search).get('secs')) || TUNE.RUN_SECONDS;
  /* ?cards=a,b,c —— 开局强制塞这几张卡，用来定向验证某一批新卡。 */
  const force = (new URLSearchParams(location.search).get('cards') || '').split(',').filter(Boolean);
  const r = fullRun(seed, strong, moving, weak, secs, force);
  say('SEED ' + seed + (strong ? ' [强]' : '') + (moving ? ' [跑动]' : '') +
      (weak > 1 ? ' [弱×' + weak + ']' : '') + '  ' + fmtTime(r.time) +
      '  身边 ' + r.near.toFixed(1) + '（前3分 ' + r.nearEarly.toFixed(1) + '，最低 ' + r.nearMin + '）' +
      '  3分击杀 ' + r.kills3 + '  升级 ' + r.picks +
      '  分子 ' + r.mol + '  击杀 ' + r.kills + '  拒绝 ' + r.rejected +
      '  错误 ' + r.err + '  ' + r.build);
  /* 刷怪落点：Bao 报的是「刷在脸上」。把体感换成数字。 */
  const sp = r.sp;
  say('  刷怪 ' + sp.n + ' 次　平均 ' + (sp.sum / Math.max(1, sp.n)).toFixed(1) + 'm　' +
      '最近 ' + (sp.min === 1e9 ? '-' : sp.min.toFixed(1)) + 'm　' +
      '20m 内 ' + Math.round(sp.near20 / Math.max(1, sp.n) * 100) + '%　' +
      '背后半球 ' + Math.round(sp.rear / Math.max(1, sp.n) * 100) + '%');
  say('  落点驳回 ' + JSON.stringify(r.reject));
  say('  全图在场 平均 ' + r.alive.toFixed(1) + '　峰值 ' + r.alivePeak +
      '　（上限 ' + TUNE.SPAWN.aliveCap + '，动态目标最高 ' +
      Math.round(TUNE.SPAWN.targetBase + TUNE.SPAWN.targetCoef) + '）' +
      '　单帧耗时 平均 ' + r.msAvg.toFixed(2) + 'ms 最差 ' + r.msMax.toFixed(1) + 'ms');
  /* 升级到底是均匀分布还是压在后半段 —— Bao 报的是「8 分钟才 5 级」 */
  say('  升级时刻 ' + r.pickT.join(' '));
  const by8 = r.pickT.filter(t => t <= 480).length;
  say('  8 分钟前 ' + by8 + ' 次 / 全程 ' + r.pickT.length + ' 次');
  ok(r.err === 0, r.err + ' 次运行时错误');
  ok(r.rejected === 0, r.rejected + ' 次事件触顶 —— 伤害被静默削掉了（§8.3）');
  ok(r.time > Math.min(700, secs - 20), '没跑到预期时长（' + Math.round(r.time) + 's / ' + Math.round(secs) + 's）');
  document.title = (FAIL ? 'FAILED' : 'OK') + '>>' + r.build + '|' + r.picks +
    '|' + r.mol + '|' + r.kills + '|' + r.err + '|' + r.rejected + '<<';
  document.getElementById('out').innerHTML = L.join('\n');
}

let _clock = 0;
function fullRun(seed, strong, moving, weak, secs, force) {
  RNG.init(seed);
  G.won = false; G.bossAlive = null; G.buff = null;
  document.getElementById('results').classList.remove('on');
  /* EVO 也必须重置 —— 忘了它的话，第二局起进化导演还带着上一局的
     evolutionIndex 和进度，整局只弹得出 0~1 次三选一（实测种子 22 只有
     1 次升级、种子 33 一次都没有）。 */
  BUILD.init(); ATK.init(); MAPEV.init(); MAPBUILD.init(); EVO.init();
  Director.resetSpawnStat(); NAV.stats.rejectReason = {}; NAV.stats.spawnRejected = 0;
  G.time = 0; G.tlIndex = 0; G.over = false; G.phase = 'play';
  G.stats.kills = 0;
  const err0 = window.__err.length;
  DebugPanel.god = true;                 // 量系统，不量难度
  /* 每一局都要把世界清干净。只清敌人是不够的：经验球、子弹、危险区
     会一局一局地攒下来，第十局的每帧开销是第一局的十几倍，
     表现是「跑到一半越来越慢，最后超时」。 */
  G.enemies.live.slice().forEach(e => { e.dead = true; G.enemies.release(e); });
  G.enemies.compact();
  G.bullets.live.slice().forEach(b => G.bullets.release(b));
  G.bullets.compact();
  G.xp.length = 0; G.hazards.length = 0; G.pendings.length = 0; G.wells.length = 0;
  G.medical = null; G.airdrop = null; G.buff = null;
  G.magnet = null; G.magPending = false; G.magNextAt = undefined;
  G.acids && G.acids.live && G.acids.live.slice().forEach(a => G.acids.release(a));
  G.acids && G.acids.compact && G.acids.compact();
  MOVE.teleport(G.player, 0, 1.2, 0);
  G.player.hp = G.player.maxHp;
  /* 强 Build：多发 + 爆炸 + 穿透 + 威力，这是实测输出最高的一类组合。
     这些不计入「升级次数」—— 我们量的正是「输出高了之后能多升几次」。 */
  if (strong) ['volley', 'blast', 'pierce', 'power', 'power'].forEach(id => BUILD.take(id));
  (force || []).forEach(id => { if (BUILD.cardOf(id)) BUILD.take(id); else say('  <i>未知卡 ' + id + '</i>'); });
  recompute();
  G.player.gun.ammo = G.derived.magazine;

  /* frame() 自己记 _last 时间戳，所以每局的 t 必须【接着上一局往下走】——
     从 0 重新开始会算出负的 dt，第二局起整局一帧都不推进（表现是 0:00）。 */
  let picks = 0, minFps = 1e9;
  /* todo12 §1：量「玩家身边 35m 内有几只可打的」。
     刷怪那次改动的成败就看这个数，不是看全图在场数 ——
     地图很满而玩家面前很空，正是改之前的病。 */
  let nearSum = 0, nearN = 0, nearMin = 1e9, early = 0, earlyN = 0, kills3 = 0;
  /* 全图在场数：Bao 定稿的方案是「提高怪物数量上限」，先得知道现在到底站得住几只 */
  let aliveSum = 0, aliveN = 0, alivePeak = 0, fpsMin = 1e9, fpsN = 0, fpsSum = 0;
  const pickT = [];
  let msMax = 0, msSum = 0, msN = 0;
  const frames = Math.ceil((secs || TUNE.RUN_SECONDS) * 60) + 600;
  for (let i = 0; i < frames; i++) {
    _clock += 16.7;
    const _t0 = performance.now();
    frame(_clock);
    if (i % 7 === 0) { const d = performance.now() - _t0; msSum += d; msN++; if (d > msMax) msMax = d; }
    if (G.phase === 'choose') {
      UI._pickAt = 0; UI._released = true;
      const c = document.querySelector('#cards .card');
      if (c && c.onclick) { c.onclick(); picks++; pickT.push(Math.round(G.time)); }
    }
    /* 弱玩家：只有 1/weak 的时间在有效开火，其余时间在躲、在跑、在打空气 */
    G.player.gun.held = !weak || weak <= 1 || (i % Math.round(weak)) === 0;
    /* 蓄力枪（坍缩炮）：真人会松手，机器人不会 ——
       一直按住的话蓄力枪一发都打不出去（实测 0 击杀）。
       蓄满就松一帧，这才是它该被测到的样子。 */
    if (G.derived.chargeGun && BUILD.ctx.chargeT >= TUNE.DEMON.collapse.maxCharge) {
      G.player.gun.held = false;
    }
    if (moving) {
      /* 一个像样的玩家模型：【瞄着敌人、朝目标点平移】。
         只做「朝路点跑」的话枪口永远对着空气，12 分钟只打死 38 只 ——
         那量出来的是机器人不会瞄准，不是刷怪快慢。 */
      const p2 = G.player;
      let best = null, bd = 1e9;
      const list = G.enemies.live;
      for (let k = 0; k < list.length; k++) {
        const e = list[k];
        if (e.dead || e._dead) continue;
        const ex = e.pos.x - p2.pos.x, ez = e.pos.z - p2.pos.z;
        const d2 = ex * ex + ez * ez;
        if (d2 < bd) { bd = d2; best = e; }
      }
      if (best) {
        p2.yaw = Math.atan2(-(best.pos.x - p2.pos.x), -(best.pos.z - p2.pos.z));
        if (weak > 1) p2.yaw += Math.sin(i * 0.07) * 0.25;   // 瞄不准
      }

      /* 在四个战斗单元中心之间巡逻，每 20 秒换一个目标；
         用平移键走过去，不改瞄准方向 */
      const WP = [[-55, -31], [55, -39], [-55, 40], [55, 39]];
      const w = WP[Math.floor(G.time / 20) % WP.length];
      const wx = w[0] - p2.pos.x, wz = w[1] - p2.pos.z;
      const len = Math.max(0.001, Math.hypot(wx, wz));
      /* 把世界方向投到「瞄准朝向」的前 / 右轴上 */
      const fx = -Math.sin(p2.yaw), fz = -Math.cos(p2.yaw);
      const rx = Math.cos(p2.yaw), rz = -Math.sin(p2.yaw);
      const fwd = (wx * fx + wz * fz) / len, rgt = (wx * rx + wz * rz) / len;
      KEY.KeyW = fwd > 0.35; KEY.KeyS = fwd < -0.35;
      KEY.KeyD = rgt > 0.35; KEY.KeyA = rgt < -0.35;
    } else {
      G.player.yaw += 0.55 * 0.0167;
    }
    if (i % 30 === 0 && G.time > 5) {
      const near = Director.countNear(TUNE.SPAWN.engageRadius);
      nearSum += near; nearN++;
      if (near < nearMin) nearMin = near;
      if (G.time <= 180) { early += near; earlyN++; kills3 = G.stats.kills; }
      aliveSum += G.enemies.count; aliveN++;
      if (G.enemies.count > alivePeak) alivePeak = G.enemies.count;
    }
    if (G.over) break;
  }
  G.player.gun.held = false;
  KEY.KeyW = KEY.KeyS = KEY.KeyA = KEY.KeyD = false;
  DebugPanel.god = false;
  return {
    time: G.time, picks: picks, kills: G.stats.kills,
    mol: BUILD.molecules().length,
    build: BUILD.molecules().map(c => c.name).join('+') || '无',
    pickT: pickT,
    near: nearN ? nearSum / nearN : 0, kills3: kills3,
    alive: aliveN ? aliveSum / aliveN : 0, alivePeak: alivePeak,
    msMax: msMax, msAvg: msN ? msSum / msN : 0,
    sp: Director.spawnStat, reject: NAV.stats.rejectReason,
    nearEarly: earlyN ? early / earlyN : 0,
    nearMin: nearMin === 1e9 ? 0 : nearMin,
    rejected: ATK.budget.rejected,
    err: window.__err.length - err0,
    minFps: minFps
  };
}

</script>
